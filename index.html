<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VectorTAB</title>
<style>
:root{
  color-scheme:light dark;
  --ground:#EFEBE3; --panel:#FDFCFA; --ink:#1C1A17; --muted:#6E665C; --line:#D9D2C5;
  --accent:#C06A22; --accent-ink:#FFF7EE;
  --shadow:0 1px 2px rgba(28,26,23,.10),0 8px 28px rgba(28,26,23,.10);
  --num:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--cjk);
     padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.top{position:sticky;top:0;z-index:5;background:var(--ground);
     border-bottom:1px solid var(--line);padding:13px 14px 11px}
.top .wrap{display:flex;align-items:baseline;gap:10px}
.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em}
.top .n{font-family:var(--num);font-size:12px;color:var(--muted)}
.top .nav{margin-left:auto;align-self:center;font-size:13px;color:var(--accent);text-decoration:none;
          padding:8px 10px;margin-right:-10px;border-radius:6px}   /* 矢量谱目录 ⇄ 图片谱目录（用户 2026-10-31：首页只放矢量谱） */
.top .nav:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* 三个栏目页签（用户 2026-10-31：弹唱谱 / 指弹谱 / 图片谱分开放，混在一起太不好找） */
.top .wrap{flex-wrap:wrap;row-gap:8px}
.tabs{margin-left:auto;display:flex;gap:4px;align-self:center}
.tab{appearance:none;background:none;border:1px solid transparent;color:var(--muted);font-family:var(--cjk);
     font-size:13px;font-weight:600;padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--line);background:var(--panel)}
.tab .k{font-family:var(--num);font-size:11px;font-weight:500;margin-left:4px;opacity:.8}
/* 指弹谱按难度 ★1~5 筛（北尚合集的五个星级目录） */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.chip{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
      font-family:var(--cjk);font-size:12px;font-weight:600;padding:5px 11px;cursor:pointer}
.chip .k{font-family:var(--num);font-weight:500;margin-left:3px;opacity:.8}
.chip[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.card .st{font-family:var(--num);font-size:11px;color:var(--muted);flex:0 0 auto;margin-left:-4px}
.wrap{max-width:860px;margin:0 auto}
main{padding:14px 14px 48px}
#q{width:100%;font-family:var(--cjk);font-size:14px;color:var(--ink);background:var(--panel);
   border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin:0 0 14px;
   -webkit-appearance:none;appearance:none}
#q:focus{outline:none;border-color:var(--accent)}
.bar{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.bar b{font-size:18px;font-weight:600}
.bar .sp{flex:1 1 auto}
.sm{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
    font-family:var(--cjk);font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer}
.sm:hover{color:var(--ink);border-color:var(--accent)}
.tip{font-size:12px;color:var(--muted);line-height:1.7;margin:-4px 0 12px}
.tip b{color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:8px 6px 8px 14px;display:flex;align-items:center;gap:10px;margin-bottom:9px;
      text-decoration:none;color:inherit;position:relative;touch-action:pan-y;
      /* iOS 上这两条必须有，否则长按整行会先弹出链接预览菜单 / 文本选择放大镜，
         手指还没开始动，拖拽就已经被原生手势抢走了。 */
      -webkit-touch-callout:none;
      -webkit-user-select:none;user-select:none}
@media (hover:hover){.card:hover{border-color:var(--accent)}}   /* 触屏上 :hover 会粘在最后点过的位置（iPad 点置顶后第 5 行一直描边） */
/* 拖拽：让开的行用 transition 滑开，被拖的那行跟手走所以不能有 transition */
.card.slide{transition:transform .16s cubic-bezier(.2,.7,.3,1)}
.card.drag{z-index:10;border-color:var(--accent);box-shadow:var(--shadow);
           cursor:grabbing;transition:none}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.dragging .card:hover{border-color:var(--line)}
body.dragging .card.drag{border-color:var(--accent)}
.card .no{font-family:var(--num);font-size:13px;color:var(--muted);
          min-width:26px;text-align:right;flex:0 0 auto}
.card .nm{flex:1;min-width:0;font-size:17px;font-weight:600;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 抓手。两条缺一不可：
   · touch-action:none —— 不写的话手指一动就被当成滚页面，拖不起来。
   · 命中区域 ≥44×44 —— 原来只有 22×26，手机上按十次有九次按空，
     按空了落在 .card 上（touch-action:pan-y），结果就是「页面滚了，行没动」。
     小圆点保持原来大小，靠 padding 把可点区域撑开。 */
.grip{appearance:none;background:none;border:0;flex:0 0 auto;
      width:44px;height:44px;display:flex;align-items:center;justify-content:center;
      color:var(--muted);cursor:grab;touch-action:none;border-radius:8px;
      -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.grip:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.grip:active{cursor:grabbing}
.grip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* 让命中目标永远是 button 本身，不是里面的 svg——svg 的 touch-action 是默认值，
   交给它当 target 容易出意外 */
.grip svg{display:block;width:20px;height:20px;pointer-events:none}
.grip[disabled]{opacity:.25;cursor:default}
/* 置顶（用户 2026-10-30）：和抓手同一套样子、同样 44×44 命中区；已在第一位的变灰 */
.pin{appearance:none;background:none;border:0;flex:0 0 auto;width:44px;height:44px;margin-right:-8px;
     display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border-radius:8px;
     -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pin:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pin:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pin svg{display:block;width:20px;height:20px;pointer-events:none}
.pin[disabled]{opacity:.25;cursor:default;background:none;color:var(--muted)}
/* 刚置顶的那行闪一下，知道它去哪了 */
@keyframes pinned{0%{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}100%{}}
.card.pinned{animation:pinned 1.2s ease-out}
.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
    font-family:var(--cjk);font-size:12px;font-weight:600;border-radius:6px;
    padding:9px 13px;flex:0 0 auto;-webkit-touch-callout:none}
.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:36px 10px}
.foot{color:var(--muted);font-size:12px;line-height:1.9;margin-top:22px;
      border-top:1px solid var(--line);padding-top:14px}
</style></head><body>

</main>

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

/* ======== 曲目顺序 ========
   纯静态页面没有后端，跨终端只能三层叠着用：
     1. localStorage —— 本机立刻生效，file:// 也行，只认这一台设备。
     2. 同目录 order.json —— 走 http(s) 时开页就拉，推几百字节就能让所有设备同步。
     3. 顺序码 —— 一串能复制粘贴的文本，离线也能把顺序带到另一台设备。
   谁新用谁（比 ts），本机改动永远立刻生效，不会被云端悄悄盖掉。 */
const OKEY='gs2.order';
/* 短分享链接：index.html?s=9fd196（曲目 id 去掉 sg- 后的前 6 位，186 首无重复）→ 跳到播放页。目录页和播放页分离后，这是最短的落点 */
(function(){ const m=/[?&]s=([0-9a-f]{6,})/i.exec(location.search); if(!m) return;
  const k=m[1].toLowerCase(), hit=SONGS.find(r=>r.id.replace(/^sg-/,'').startsWith(k));
  if(hit) location.replace('play.html?id='+hit.id+'&lib=1'+(hit.v?'&v='+hit.v:'')); })();
let ORD=null, ORDTS=0, ordNote=false, LIST=SONGS.slice();

/* ======== 栏目 ========
   song 弹唱谱 / solo 指弹谱 / image 图片谱，指弹谱再按 ★ 难度筛。状态记在 #hash（可收藏、「← 曲库」能回到原栏目）和 localStorage。 */
const CATS=[['song','弹唱谱'],['solo','指弹谱'],['image','图片谱']];
const TKEY='gs2.tab';
const catOf=x=>x.cat||'song';
let TAB='song', STAR=0;
(function(){
  let m=(location.hash||'').match(/^#(song|solo|image)(?:-([1-5]))?$/);
  if(!m){ try{ m=(localStorage.getItem(TKEY)||'').match(/^(song|solo|image)(?:-([1-5]))?$/); }catch(e){} }
  if(m){ TAB=m[1]; STAR=+(m[2]||0); }
  if(!SONGS.some(x=>catOf(x)===TAB)){ const f=CATS.find(([c])=>SONGS.some(x=>catOf(x)===c)); if(f){ TAB=f[0]; STAR=0; } }
})();
function setTab(t,st){
  TAB=t; STAR=st||0;
  const key=TAB+(STAR?'-'+STAR:'');
  try{ localStorage.setItem(TKEY,key); }catch(e){}
  try{ history.replaceState(null,'','#'+key); }catch(e){}
  render();
}
const view=()=>LIST.filter(x=>catOf(x)===TAB && (!STAR||x.star===STAR));
const sid6=id=>String(id||'').replace(/^sg-/,'').slice(0,6);

function ordRead(){ try{ const o=JSON.parse(localStorage.getItem(OKEY)||'null');
  if(o&&Array.isArray(o.ids)){ ORD=o.ids; ORDTS=o.ts||0; } }catch(e){} }
function ordWrite(){ ORDTS=Date.now();
  try{ localStorage.setItem(OKEY,JSON.stringify({v:1,ts:ORDTS,ids:ORD})); }catch(e){} }
function ordCode(){ return 'GS1'+(ORD||SONGS.map(x=>x.id)).map(sid6).join(''); }
function ordFromCode(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  if(!/^GS1[0-9a-f]+$/i.test(code)||(code.length-3)%6) return null;
  const by={}; SONGS.forEach(x=>{ by[sid6(x.id)]=x.id; });
  const ids=(code.slice(3).toLowerCase().match(/.{6}/g)||[]).map(k=>by[k]).filter(Boolean);
  return ids.length?ids:null;
}
async function ordFetch(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r=await fetch('order.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const o=await r.json();
    if(!o||!Array.isArray(o.ids)) return;
    /* 钳住未来时间：order.json 里写了个未来的 ts 会永远压过本机，
       用户在这台设备上调的顺序一刷新就被悄悄吃掉。 */
    const rt=Math.min(Number(o.ts)||0, Date.now());
    if(rt<=ORDTS) return;
    ORD=o.ids; ORDTS=rt; ordWrite(); ordNote=true;
  }catch(e){}
}
function applyOrd(){
  if(!ORD||!ORD.length){ LIST=SONGS.slice(); return; }
  const pos={}; ORD.forEach((id,i)=>{ pos[id]=i; });
  const known=[],rest=[];
  SONGS.forEach(x=>(pos[x.id]!=null?known:rest).push(x));
  known.sort((a,b)=>pos[a.id]-pos[b.id]);
  LIST=known.concat(rest);                 /* 新加的曲子排在后面，不会丢 */
}
function reorder(from,to){
  if(from===to) return;
  /* from / to 是当前栏目里的序号：把那首挪到目标那首的前面（往下拖则后面），别的栏目的曲子位置不动 */
  const V=view(); const it=V[from], tgt=V[to]; if(!it||!tgt) return;
  LIST.splice(LIST.indexOf(it),1);
  let k=LIST.indexOf(tgt); if(from<to) k+=1;
  LIST.splice(k,0,it);
  const here=new Set(LIST.map(x=>x.id));
  ORD=LIST.map(x=>x.id).concat((ORD||[]).filter(id=>!here.has(id))); ordWrite(); ordNote=false; render();
}

/* ======== 拖拽排序 ========
   用 Pointer Events，鼠标 / 触摸 / 触控笔一套代码全覆盖
   （HTML5 原生 drag-and-drop 在触摸屏上根本不触发，iPad 会完全拖不动）。

   每行等高，所以目标位置直接算：round(位移 / 行高)。不用在拖的过程中改 DOM，
   只给「被拖的那行」和「要让开的那些行」加 transform，松手时才真正重排。
   这样既不会触发反复的 layout，也不会出现元素在手指底下跳来跳去。 */
let drag=null, dragEndAt=0, autoRaf=0, lastY=0;

function rowStep(){
  const c=document.querySelector('.card');
  return c ? c.offsetHeight + 9 : 0;          /* 9 = .card 的 margin-bottom */
}
function beginDrag(ev, card, idx){
  if(drag || searching()) return;
  const cards=[...document.querySelectorAll('.card')];
  lastY=ev.clientY;
  /* 起点存**页面坐标**（clientY + scrollY），不是视口坐标。
     拖到边缘要自动滚页面，一滚 clientY 不变但元素位置变了，
     用视口坐标算位移会原地不动——这正是「拖不到最顶上」的原因。 */
  drag={card, idx, to:idx, y0:ev.clientY+scrollY, cards, h:rowStep(),
        moved:false, pid:ev.pointerId};
  try{ card.setPointerCapture(ev.pointerId); }catch(e){}
  cards.forEach(c=>{ if(c!==card) c.classList.add('slide'); });
  card.classList.add('drag');
  document.body.classList.add('dragging');
}
/* 位移、让位、序号都从 lastY + scrollY 推出来，
   这样「手指动」和「页面自己滚」两种情况走同一段代码。 */
function applyDrag(){
  if(!drag) return;
  const dy=(lastY+scrollY)-drag.y0;
  drag.card.style.transform='translateY('+dy+'px)';
  const n=drag.cards.length;
  const to=Math.max(0, Math.min(n-1, drag.idx+Math.round(dy/drag.h)));
  if(to===drag.to) return;
  drag.to=to;
  drag.cards.forEach((c,i)=>{
    if(c===drag.card) return;
    let off=0;
    if(drag.idx<to && i>drag.idx && i<=to) off=-drag.h;
    else if(drag.idx>to && i>=to && i<drag.idx) off=drag.h;
    c.style.transform = off ? 'translateY('+off+'px)' : '';
    /* 序号跟着一起变。不然拖的时候左边是 1 3 4 2 5，看着像出了 bug */
    const no=c.querySelector('.no');
    if(no) no.textContent = String(i + (off<0?-1:off>0?1:0) + 1);
  });
  const no=drag.card.querySelector('.no');
  if(no) no.textContent=String(to+1);
}
/* 拖到视口上下边缘就自动滚。手指停在边缘不动时页面也要继续滚，
   所以必须跑 rAF，不能只在 pointermove 里做。 */
function autoScroll(){
  if(!drag){ autoRaf=0; return; }
  const vh=innerHeight, edge=Math.min(84, vh*0.18), MAX=22;
  let v=0;
  if(lastY<edge)            v=-MAX*(1-lastY/edge);
  else if(lastY>vh-edge)    v= MAX*(1-(vh-lastY)/edge);
  if(v){
    const before=scrollY;
    scrollBy(0, v);
    if(scrollY!==before) applyDrag();         /* 真滚动了才重算 */
  }
  autoRaf=requestAnimationFrame(autoScroll);
}
function moveDrag(ev){
  if(!drag || ev.pointerId!==drag.pid) return;
  lastY=ev.clientY;
  if(!drag.moved){
    if(Math.abs((ev.clientY+scrollY)-drag.y0)<4) return;  /* 没过阈值仍算点击 */
    drag.moved=true;
    if(!autoRaf) autoRaf=requestAnimationFrame(autoScroll);
  }
  ev.preventDefault();
  applyDrag();
}
function endDrag(ev){
  if(!drag || (ev && ev.pointerId!==drag.pid)) return;
  const {idx,to,moved,cards,card}=drag;
  cancelAnimationFrame(autoRaf); autoRaf=0;
  try{ card.releasePointerCapture(drag.pid); }catch(e){}
  cards.forEach(c=>{ c.style.transform=''; c.classList.remove('slide','drag'); });
  document.body.classList.remove('dragging');
  drag=null;
  if(moved){
    dragEndAt=Date.now();                     /* 抑制紧随其后的那次 click，别跳走 */
    reorder(idx,to);
  }
}
const searching=()=>!!($('q').value||'').trim();
addEventListener('hashchange',()=>{ const m=(location.hash||'').match(/^#(song|solo|image)(?:-([1-5]))?$/); if(m) setTab(m[1],+(m[2]||0)); });
function ordDialog(){
  const code=ordCode();
  const v=prompt('当前顺序码（复制走，在别的设备上再粘回来）：\n\n'+code+
    '\n\n要应用别处来的顺序，把那串码粘在这里再按确定；按取消则不动。', code);
  if(v==null||v.trim()===code) return;
  const ids=ordFromCode(v);
  if(!ids){ alert('这串码不对，或者里面的曲子这个目录里没有。'); return; }
  ORD=ids; ordWrite(); applyOrd(); render();
  alert('顺序已套用（'+ids.length+' 首）。');
}

function renderTabs(){
  const T=$('tabs'); T.textContent='';
  CATS.forEach(([c,name])=>{
    const n=SONGS.filter(x=>catOf(x)===c).length; if(!n) return;
    const b=el('button','tab',name); b.type='button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(c===TAB)); b.appendChild(el('span','k',String(n)));
    b.onclick=()=>setTab(c,0); T.appendChild(b);
  });
  const C=$('chips'); C.textContent='';
  const stars=[...new Set(SONGS.filter(x=>catOf(x)===TAB&&x.star).map(x=>x.star))].sort();
  C.hidden=!stars.length;
  if(stars.length){
    const all=el('button','chip','全部'); all.type='button'; all.setAttribute('aria-selected',String(!STAR));
    all.appendChild(el('span','k',String(SONGS.filter(x=>catOf(x)===TAB).length))); all.onclick=()=>setTab(TAB,0); C.appendChild(all);
    stars.forEach(st=>{
      const b=el('button','chip','★'.repeat(st)); b.type='button'; b.setAttribute('aria-selected',String(STAR===st));
      b.appendChild(el('span','k',String(SONGS.filter(x=>catOf(x)===TAB&&x.star===st).length)));
      b.onclick=()=>setTab(TAB,st); C.appendChild(b);
    });
  }
}
function render(){
  renderTabs();
  const L=$('list'); L.textContent='';
  const kw=($('q').value||'').trim().toLowerCase();
  const VIEW=view();
  const show=kw?VIEW.filter(x=>x.title.toLowerCase().includes(kw)):VIEW;
  $('cnt').textContent = kw ? show.length+' / '+VIEW.length+' 首' : '共 '+VIEW.length+' 首';
  const bar=el('div','bar');
  bar.appendChild(el('b',null,(CATS.find(([c])=>c===TAB)||[0,'曲目'])[1]+(STAR?' · '+'★'.repeat(STAR):'')));
  bar.appendChild(el('span','sp',''));
  const bc=el('button','sm','顺序码'); bc.onclick=ordDialog; bar.appendChild(bc);
  if(ORD&&ORD.length){
    const br=el('button','sm','默认顺序');
    br.onclick=()=>{ if(!confirm('恢复成文件自带的顺序？')) return;
      ORD=null; ORDTS=0; try{ localStorage.removeItem(OKEY); }catch(e){}
      applyOrd(); render(); };
    bar.appendChild(br);
  }
  L.appendChild(bar);
  if(ordNote){ const t=el('div','tip');
    t.innerHTML='曲目顺序已按 <b>order.json</b> 更新。在这里拖一下就会以本机为准。';
    L.appendChild(t); }
  if(kw){ const t=el('div','tip');
    t.innerHTML='搜索时不能调顺序——<b>清空搜索框</b>再拖。'; L.appendChild(t); }
  if(!show.length){ L.appendChild(el('div','empty', kw?'没有叫「'+$('q').value.trim()+'」的曲子。':'还没有曲目。')); return; }
  show.forEach(s=>{
    const i=VIEW.indexOf(s);
    const a=el('a','card'); a.href=s.file+'&lib=1'+(s.v?'&v='+s.v:'');   /* v＝页面内容哈希：换谱/改名后浏览器缓存（Pages 给 10 分钟）不会再顶着旧页 */
    /* <a> 默认可以被原生拖拽（拖链接），不关掉的话一按下就被浏览器接管，
       pointermove 再也不来，整行拖就是拖不动。 */
    a.draggable=false; a.dataset.id=s.id;
    a.addEventListener('dragstart', ev=>ev.preventDefault());
    a.appendChild(el('span','no',String(i+1)));
    a.appendChild(el('b','nm',s.title));
    if(s.star&&!STAR) a.appendChild(el('span','st','★'.repeat(s.star)));   /* 「全部」里标出难度 */

    const g=el('button','grip'); g.type='button';
    g.setAttribute('aria-label','拖动排序，或用上下方向键');
    g.title='拖动排序';
    g.innerHTML='<svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">'
      +'<circle cx="6.5" cy="4" r="1.5"/><circle cx="11.5" cy="4" r="1.5"/>'
      +'<circle cx="6.5" cy="9" r="1.5"/><circle cx="11.5" cy="9" r="1.5"/>'
      +'<circle cx="6.5" cy="14" r="1.5"/><circle cx="11.5" cy="14" r="1.5"/></svg>';
    g.disabled=!!kw;
    /* 抓手：鼠标/触摸/触控笔都走 pointer 事件 */
    g.addEventListener('pointerdown', ev=>{
      if(kw) return;
      ev.preventDefault(); ev.stopPropagation();
      beginDrag(ev, a, i);
    });
    /* 键盘兜底：抓手聚焦后上下键也能挪，不必非得用鼠标 */
    g.addEventListener('keydown', ev=>{
      if(kw) return;
      const d = ev.key==='ArrowUp' ? -1 : ev.key==='ArrowDown' ? 1 : 0;
      if(!d) return;
      ev.preventDefault();
      const j=i+d; if(j<0||j>=LIST.length) return;
      reorder(i,j);
      const gs=document.querySelectorAll('.grip');
      if(gs[j]) gs[j].focus();
    });
    g.addEventListener('click', ev=>{ ev.preventDefault(); ev.stopPropagation(); });

    /* 置顶：挪到整个曲目表第一位（搜索时也能点），和拖拽一样存本机顺序 */
    const pn=el('button','pin'); pn.type='button';
    pn.setAttribute('aria-label','置顶'); pn.title=i===0?'已在最前':'置顶';
    pn.innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      +'<path d="M4 3.5h12"/><path d="M10 17V7.5"/><path d="M5.5 11.5 10 7l4.5 4.5"/></svg>';
    pn.disabled = i===0;
    pn.addEventListener('pointerdown', ev=>ev.stopPropagation());   /* 别让整行的鼠标拖拽接管 */
    pn.addEventListener('click', ev=>{
      ev.preventDefault(); ev.stopPropagation();
      if(i===0) return;
      reorder(i,0);
      const c=[...document.querySelectorAll('.card')].find(x=>x.dataset.id===s.id);
      if(c){ c.classList.add('pinned'); if(!kw) c.scrollIntoView({block:'nearest',behavior:'smooth'}); }
    });
    a.appendChild(pn);
    a.appendChild(g);

    a.appendChild(el('span','go','演奏'));
    /* 鼠标图省事：整行任意位置按下也能拖（移动超过阈值才算拖）。
       触摸不这么干——那样会把「划一下滚页面」变成拖行。 */
    a.addEventListener('pointerdown', ev=>{
      if(kw || ev.pointerType!=='mouse' || ev.button!==0) return;
      if(ev.target.closest('.go,.grip,.pin')) return;
      beginDrag(ev, a, i);
    });
    /* 刚拖完浏览器还会补一个 click，不拦住就会跳进那首歌 */
    a.addEventListener('click', ev=>{
      if(drag || Date.now()-dragEndAt < 250){ ev.preventDefault(); ev.stopPropagation(); }
    });
    L.appendChild(a);
  });
}

addEventListener('pointermove', moveDrag, {passive:false});
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
$('q').oninput=render;
ordRead();
const h=(location.hash||'').match(/[#&]o=(GS1[0-9a-f]+)/i);
if(h){ const ids=ordFromCode(h[1]); if(ids){ ORD=ids; ordWrite(); } }
applyOrd(); render();
ordFetch().then(()=>{ applyOrd(); render(); });
window.__CAT={ get list(){ return LIST.map(x=>x.id); }, ordCode:()=>ordCode(),
               ordApply:c=>{ const ids=ordFromCode(c); if(!ids) return false;
                             ORD=ids; ordWrite(); applyOrd(); render(); return true; } };
</script></body></html>
